<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookkeeper</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="shared.css?v=1" />
  <style>
    /* ── Browse page overrides ───────────────────────────── */
    header { position: sticky; top: 0; background: var(--bg); z-index: 50; }
    .home-btn { cursor: default; }
    .home-btn:hover { color: var(--accent); }

    /* ── Hero ────────────────────────────────────────────── */
    .browse-hero {
      padding: 2.5rem 2rem 0.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .browse-hero h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 0.3rem;
    }
    .browse-hero p { color: var(--muted); font-size: 0.9rem; }

    /* ── Genre rows ──────────────────────────────────────── */
    .shelf-section { padding: 2rem 0 0.5rem; }
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0 2rem 1rem;
    }
    .section-title { font-size: 1.1rem; font-weight: 700; color: var(--text); }

    .row-wrapper { position: relative; display: flex; align-items: center; }
    .row-scroll {
      display: flex;
      gap: 1.25rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      padding: 0.5rem 2rem 1.5rem;
      flex: 1;
    }
    .row-scroll::-webkit-scrollbar { display: none; }

    .row-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-60%);
      z-index: 10;
      background: rgba(30,27,46,0.9);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      font-size: 1.4rem;
      line-height: 1;
      width: 36px;
      height: 64px;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s;
      opacity: 0;
      pointer-events: none;
    }
    .row-wrapper:hover .row-arrow { opacity: 1; pointer-events: auto; }
    .row-arrow:hover { background: var(--surface2); color: var(--accent); }
    .row-arrow.left { left: 2px; }
    .row-arrow.right { right: 2px; }

    .row-loading { color: var(--muted); font-size: 0.88rem; padding: 3rem 0; }
    .row-empty   { color: var(--muted); font-size: 0.88rem; padding: 3rem 0; white-space: nowrap; }

    /* ── Stats bar ───────────────────────────────────── */
    .stats-bar { display: flex; gap: 1rem; padding: 1.5rem 2rem; }
    .stat-card {
      flex: 1; background: var(--surface); border-radius: var(--radius);
      padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 0.25rem;
      text-decoration: none; transition: background .15s;
    }
    .stat-card:hover { background: var(--surface2); }
    .stat-number { font-size: 2rem; font-weight: 700; color: var(--accent); line-height: 1; }
    .stat-label {
      font-size: 0.75rem; color: var(--muted); font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.8px;
    }

    /* ── Goal banner ─────────────────────────────────── */
    .goal-banner {
      display: flex; align-items: center; gap: 0.85rem;
      padding: 0.7rem 2rem; font-size: 0.88rem;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .goal-year-label { color: var(--muted); font-size: 0.8rem; white-space: nowrap; flex-shrink: 0; }
    .goal-bar-wrap {
      flex: 1; height: 5px; background: rgba(255,255,255,0.08);
      border-radius: 3px; overflow: hidden; min-width: 60px;
    }
    .goal-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .5s ease; }
    .goal-count {
      color: var(--text); font-weight: 600; white-space: nowrap; flex-shrink: 0;
      cursor: pointer; border-bottom: 1px dashed transparent; transition: border-color .15s;
    }
    .goal-count:hover { border-bottom-color: rgba(255,255,255,0.3); }
    .goal-input {
      width: 110px; padding: 0.2rem 0.5rem; border-radius: var(--radius);
      border: 1px solid var(--accent); background: var(--surface2);
      color: var(--text); font-size: 0.85rem; font-family: inherit; outline: none;
    }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">Bookkeeper</div>
  <nav>
    <button id="sidebar-shelf-btn">My Shelf →</button>
    <div class="sidebar-divider"></div>
    <button data-tab="reading">Currently Reading</button>
    <button data-tab="plan_to_read">Want to Read</button>
    <button data-tab="read">Read</button>
  </nav>
</div>

<header>
  <div class="header-top">
    <button class="menu-btn" id="menu-btn" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <button id="home-btn" class="home-btn">Bookkeeper</button>
    <div class="header-right">
      <button class="search-icon-btn" id="search-icon-btn" aria-label="Search">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <div class="user-menu" id="user-menu">
        <button class="user-btn" id="user-btn" aria-label="User menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="8" r="4"/>
            <path d="M12 14c-5.3 0-8 2.7-8 4v1h16v-1c0-1.3-2.7-4-8-4z"/>
          </svg>
        </button>
        <div class="user-dropdown" id="user-dropdown">
          <div class="dropdown-username" id="dropdown-username"></div>
          <button class="dropdown-item" id="logout-btn">Log out</button>
        </div>
      </div>
    </div>
  </div>
  <div class="header-search" id="header-search">
    <div class="header-search-bar">
      <input type="text" id="header-search-input" placeholder="Search books by title or author…" autocomplete="off" />
      <button class="header-search-close" id="header-search-close" aria-label="Close search">✕</button>
    </div>
    <div class="header-search-results" id="header-search-results"></div>
  </div>
</header>

<div id="browse-content">
  <div class="browse-hero">
    <h1>Discover Books</h1>
    <p>Browse by genre and add anything to your shelf</p>
  </div>
  <div class="stats-bar">
    <a class="stat-card" href="shelf.html?tab=reading">
      <div class="stat-number" id="stat-reading">—</div>
      <div class="stat-label">Currently Reading</div>
    </a>
    <a class="stat-card" href="shelf.html?tab=plan_to_read">
      <div class="stat-number" id="stat-want">—</div>
      <div class="stat-label">Want to Read</div>
    </a>
    <a class="stat-card" href="shelf.html?tab=read">
      <div class="stat-number" id="stat-read">—</div>
      <div class="stat-label">Books Read</div>
    </a>
  </div>
  <div class="goal-banner" id="goal-banner">
    <span class="goal-year-label" id="goal-year-label"></span>
    <div class="goal-bar-wrap" id="goal-bar-wrap" hidden>
      <div class="goal-bar-fill" id="goal-bar-fill" style="width:0%"></div>
    </div>
    <span class="goal-count" id="goal-count" title="Click to set goal"></span>
    <input class="goal-input" id="goal-input" type="number" min="1" max="999" placeholder="# of books…" hidden />
  </div>
  <div id="genre-rows"></div>
</div>

<div class="book-detail-overlay" id="book-detail-overlay">
  <div class="book-detail-panel">
    <button class="book-detail-close" id="book-detail-close">✕</button>
    <div class="book-detail-layout">
      <div class="book-detail-left">
        <div class="book-detail-cover-slot"></div>
        <div class="book-detail-meta-list"></div>
      </div>
      <div class="book-detail-right">
        <div class="book-detail-badge"></div>
        <div class="book-detail-title"></div>
        <div class="book-detail-author"></div>
        <div class="book-detail-stars"></div>
        <div class="book-detail-progress"></div>
        <div class="book-detail-subjects"></div>
        <div class="book-detail-desc"></div>
        <div class="book-detail-notes"></div>
        <div class="book-detail-actions"></div>
      </div>
    </div>
  </div>
</div>

<div class="status-modal-overlay" id="status-modal-overlay">
  <div class="status-modal">
    <div class="status-modal-title">Add to shelf</div>
    <div class="status-modal-book" id="status-modal-book"></div>
    <div class="status-options">
      <button class="status-opt" data-status="reading">Currently Reading</button>
      <button class="status-opt" data-status="plan_to_read">Want to Read</button>
      <button class="status-opt" data-status="read">Already Read</button>
    </div>
    <button class="status-cancel" id="status-modal-cancel">Cancel</button>
  </div>
</div>

<script src="shared.js?v=15"></script>
<script src="browse.js?v=11"></script>
</body>
</html>
