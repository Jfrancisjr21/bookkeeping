<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookkeeper</title>
  <style>
    :root {
      --bg:        #13111a;
      --surface:   #1e1b2e;
      --surface2:  #2a2540;
      --accent:    #c084fc;
      --accent2:   #a855f7;
      --text:      #e8e3f0;
      --muted:     #7c7a8e;
      --card-w:    140px;
      --cover-h:   210px;
      --radius:    8px;
      --shadow:    0 6px 24px rgba(0,0,0,0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────── */
    header {
      padding: 1.5rem 2rem 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
    }

    /* ── Search ─────────────────────────────────────── */
    .search-section {
      padding: 1.5rem 2rem 0;
    }
    .search-bar {
      display: flex;
      gap: 0.5rem;
      max-width: 560px;
    }
    .search-bar input {
      flex: 1;
      padding: 0.65rem 1rem;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.12);
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color .15s;
    }
    .search-bar input:focus { border-color: var(--accent); }
    .search-bar input::placeholder { color: var(--muted); }
    .search-bar button {
      padding: 0.65rem 1.4rem;
      border-radius: var(--radius);
      border: none;
      background: var(--accent2);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .search-bar button:hover { background: var(--accent); }

    .search-results {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1.2rem;
      min-height: 1rem;
    }
    .search-hint {
      font-size: 0.82rem;
      color: var(--muted);
      padding: 0.5rem 0;
    }

    /* ── Shelf nav ──────────────────────────────────── */
    .shelf-nav {
      display: flex;
      gap: 0;
      padding: 0 2rem;
      margin-top: 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .shelf-nav button {
      padding: 0.8rem 1.4rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: color .15s, border-color .15s;
      font-family: inherit;
    }
    .shelf-nav button:hover { color: var(--text); }
    .shelf-nav button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── Book grid ──────────────────────────────────── */
    .book-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      padding: 2rem;
    }
    .empty-state {
      padding: 3rem 0;
      color: var(--muted);
      font-size: 0.9rem;
      width: 100%;
      text-align: center;
    }

    /* ── Book card ──────────────────────────────────── */
    .book-card {
      width: var(--card-w);
      cursor: pointer;
      transition: transform .2s;
    }
    .book-card:hover { transform: translateY(-5px); }
    .book-card:hover .cover-img { box-shadow: 0 12px 36px rgba(192,132,252,0.3); }

    .cover-wrap {
      width: var(--card-w);
      height: var(--cover-h);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: box-shadow .2s;
    }
    .cover-placeholder {
      width: 100%;
      height: 100%;
      background: var(--surface2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
      text-align: center;
      gap: 0.4rem;
    }
    .cover-placeholder .ph-title {
      font-size: 0.72rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
      word-break: break-word;
    }
    .cover-placeholder .ph-author {
      font-size: 0.62rem;
      color: var(--muted);
    }

    .card-meta { margin-top: 0.5rem; }
    .card-meta .card-title {
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .card-meta .card-author {
      font-size: 0.7rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .card-stars {
      font-size: 0.7rem;
      margin-top: 3px;
      color: #f5c518;
      letter-spacing: 1px;
    }

    /* ── Search result cards ────────────────────────── */
    .search-card { width: var(--card-w); }
    .search-card .add-btn {
      margin-top: 0.4rem;
      width: 100%;
      padding: 0.3rem 0;
      border-radius: 4px;
      border: 1px solid var(--accent2);
      background: transparent;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .search-card .add-btn:hover { background: var(--accent2); color: #fff; }
    .search-card .add-btn:disabled { opacity: 0.5; cursor: default; }

    /* ── Modal ──────────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 14px;
      padding: 2rem;
      max-width: 500px;
      width: 92%;
      display: flex;
      gap: 1.5rem;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .modal-cover {
      flex-shrink: 0;
      width: 110px;
      height: 165px;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .modal-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .modal-cover-placeholder {
      width: 100%;
      height: 100%;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.6rem;
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .modal-body { flex: 1; min-width: 0; }
    .modal-book-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.2rem;
    }
    .modal-book-author {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .field-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 0.3rem;
      margin-top: 0.9rem;
    }
    .field-label:first-of-type { margin-top: 0; }
    .modal-body select,
    .modal-body textarea,
    .modal-body input[type=date] {
      width: 100%;
      padding: 0.45rem 0.7rem;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.12);
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    .modal-body select:focus,
    .modal-body textarea:focus,
    .modal-body input[type=date]:focus { border-color: var(--accent); }
    .modal-body textarea { resize: vertical; min-height: 64px; }

    .stars-row { display: flex; gap: 5px; margin-top: 0.3rem; }
    .star {
      font-size: 1.3rem;
      cursor: pointer;
      color: var(--surface2);
      transition: color .1s, transform .1s;
      line-height: 1;
    }
    .star:hover, .star.lit { color: #f5c518; }
    .star:hover { transform: scale(1.15); }

    .modal-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.2rem;
      flex-wrap: wrap;
    }
    .btn-save {
      padding: 0.45rem 1.1rem;
      border-radius: var(--radius);
      border: none;
      background: var(--accent2);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-save:hover { background: var(--accent); }
    .btn-ghost {
      padding: 0.45rem 1rem;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.15);
      background: none;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color .15s, color .15s;
      font-family: inherit;
    }
    .btn-ghost:hover { border-color: #ff6b6b; color: #ff6b6b; }
    .btn-close {
      margin-left: auto;
      padding: 0.45rem 1rem;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.1);
      background: none;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-close:hover { color: var(--text); }
  </style>
</head>
<body>

<header>
  <h1>Bookkeeper</h1>
</header>

<section class="search-section">
  <div class="search-bar">
    <input id="search-input" type="text" placeholder="Search Open Library by title or author…" />
    <button id="search-btn">Search</button>
  </div>
  <div class="search-results" id="search-results"></div>
</section>

<nav class="shelf-nav">
  <button class="active" data-tab="reading">Currently Reading</button>
  <button data-tab="plan_to_read">Want to Read</button>
  <button data-tab="read">Read</button>
</nav>

<div class="book-grid" id="book-grid"></div>

<!-- Detail modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-cover" id="modal-cover"></div>
    <div class="modal-body">
      <div class="modal-book-title" id="modal-title"></div>
      <div class="modal-book-author" id="modal-author"></div>

      <label class="field-label">Status</label>
      <select id="modal-status">
        <option value="reading">Currently Reading</option>
        <option value="plan_to_read">Want to Read</option>
        <option value="read">Read</option>
      </select>

      <label class="field-label">Rating</label>
      <div class="stars-row" id="modal-stars">
        <span class="star" data-v="1">★</span>
        <span class="star" data-v="2">★</span>
        <span class="star" data-v="3">★</span>
        <span class="star" data-v="4">★</span>
        <span class="star" data-v="5">★</span>
      </div>

      <label class="field-label">Date Read</label>
      <input type="date" id="modal-date-read" />

      <label class="field-label">Notes</label>
      <textarea id="modal-notes" rows="3"></textarea>

      <div class="modal-actions">
        <button class="btn-save" id="modal-save">Save</button>
        <button class="btn-ghost" id="modal-delete">Remove</button>
        <button class="btn-close" id="modal-close-btn">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
