<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookkeeper — Shelf</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="shared.css" />
  <style>
    /* ── Shelf page overrides ────────────────────────── */
    header { padding-bottom: 0; }
    .header-top { padding: 1.5rem 2rem 1.2rem; }

    /* ── Shelf filter + sort ────────────────────────── */
    .shelf-filter-bar {
      padding: 1rem 2rem 0; display: flex; gap: 0.5rem; align-items: center; max-width: 600px;
    }
    .shelf-filter-bar input {
      flex: 1; padding: 0.55rem 1rem; border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.12); background: var(--surface);
      color: var(--text); font-size: 0.9rem; outline: none; transition: border-color .15s;
    }
    .shelf-filter-bar input:focus { border-color: var(--accent); }
    .shelf-filter-bar input::placeholder { color: var(--muted); }
    .sort-picker { position: relative; flex-shrink: 0; }
    .sort-icon-btn {
      width: 34px; height: 34px; border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.12); background: var(--surface);
      color: var(--muted); cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: color .15s, border-color .15s;
    }
    .sort-icon-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
    .sort-icon-btn.active { color: var(--accent); border-color: var(--accent); }
    .sort-dropdown {
      display: none; flex-direction: column; position: absolute;
      top: calc(100% + 6px); right: 0; min-width: 148px;
      background: var(--surface2); border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 24px rgba(0,0,0,0.45); z-index: 100; overflow: hidden;
    }
    .sort-dropdown.open { display: flex; }
    .sort-opt {
      padding: 0.52rem 1rem; background: none; border: none;
      color: var(--muted); font-size: 0.85rem; text-align: left;
      cursor: pointer; font-family: inherit; transition: background .1s, color .1s;
    }
    .sort-opt:hover { background: rgba(255,255,255,0.06); color: var(--text); }
    .sort-opt.active { color: var(--accent); font-weight: 600; }

    /* ── Year filter ─────────────────────────────────── */
    #year-filter {
      padding: 0.48rem 0.7rem; border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.12); background: var(--surface);
      color: var(--text); font-size: 0.85rem; font-family: inherit;
      outline: none; cursor: pointer; transition: border-color .15s;
      flex-shrink: 0;
    }
    #year-filter:focus { border-color: var(--accent); }

    /* ── Journal entries ─────────────────────────────── */
    #journal-entries-list { margin-bottom: 0.5rem; }
    .journal-entry {
      background: var(--surface); border-radius: var(--radius);
      padding: 0.65rem 0.85rem; margin-bottom: 0.5rem;
      border-left: 2px solid var(--accent);
    }
    .journal-entry-header {
      display: flex; align-items: center; gap: 0.5rem;
      margin-bottom: 0.3rem;
    }
    .journal-entry-date { font-size: 0.75rem; color: var(--muted); }
    .journal-entry-page {
      font-size: 0.72rem; background: rgba(255,255,255,0.08);
      padding: 0.1rem 0.4rem; border-radius: 3px; color: var(--muted);
    }
    .journal-entry-text { font-size: 0.88rem; color: var(--text); white-space: pre-wrap; }
    .journal-empty, .journal-loading { font-size: 0.82rem; color: var(--muted); padding: 0.3rem 0 0.5rem; }

    /* ── Book grid ──────────────────────────────────── */
    .book-grid { display: flex; flex-wrap: wrap; gap: 1.5rem; padding: 2rem; }
    .empty-state { padding: 3rem 0; color: var(--muted); font-size: 0.9rem; width: 100%; text-align: center; }

  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">My Shelf</div>
  <nav>
    <button id="sidebar-home-btn">← Home</button>
    <div class="sidebar-divider"></div>
    <button class="active" data-tab="reading">Currently Reading</button>
    <button data-tab="plan_to_read">Want to Read</button>
    <button data-tab="read">Read</button>
  </nav>
  <div class="sidebar-divider"></div>
  <div class="cal-widget">
    <div class="cal-header">
      <button class="cal-nav-btn" id="cal-prev" aria-label="Previous month">&#8249;</button>
      <span id="cal-month-label"></span>
      <button class="cal-nav-btn" id="cal-next" aria-label="Next month">&#8250;</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>

<header>
  <div class="header-top">
    <button class="menu-btn" id="menu-btn" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <button id="home-btn" class="home-btn">Bookkeeper</button>
    <div class="header-right">
      <button class="search-icon-btn" id="search-icon-btn" aria-label="Search">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <div class="user-menu" id="user-menu">
        <button class="user-btn" id="user-btn" aria-label="User menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="8" r="4"/>
            <path d="M12 14c-5.3 0-8 2.7-8 4v1h16v-1c0-1.3-2.7-4-8-4z"/>
          </svg>
        </button>
        <div class="user-dropdown" id="user-dropdown">
          <div class="dropdown-username" id="dropdown-username"></div>
          <button class="dropdown-item" id="logout-btn">Log out</button>
        </div>
      </div>
    </div>
  </div>
  <div class="header-search" id="header-search">
    <div class="header-search-bar">
      <input type="text" id="header-search-input" placeholder="Search books by title or author…" autocomplete="off" />
      <button class="header-search-close" id="header-search-close" aria-label="Close search">✕</button>
    </div>
    <div class="header-search-results" id="header-search-results"></div>
  </div>
</header>

<div class="page-loader" id="page-loader"><div class="spinner"></div></div>

<div class="shelf-content hidden" id="shelf-content">

<div class="shelf-filter-bar">
  <input id="shelf-filter" type="text" placeholder="Filter by title or author…" autocomplete="off" />
  <select id="year-filter" hidden></select>
  <div class="sort-picker" id="sort-picker">
    <button class="sort-icon-btn" id="sort-icon-btn" aria-label="Sort">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="9" y1="18" x2="15" y2="18"/>
      </svg>
    </button>
    <div class="sort-dropdown" id="sort-dropdown">
      <button class="sort-opt active" data-sort="default">Default</button>
      <button class="sort-opt" data-sort="title">Title A→Z</button>
      <button class="sort-opt" data-sort="author">Author A→Z</button>
      <button class="sort-opt" data-sort="rating">Rating ↓</button>
      <button class="sort-opt" data-sort="date_read">Date Read ↓</button>
    </div>
  </div>
</div>

<div class="book-grid" id="book-grid"></div>

</div><!-- /.shelf-content -->

<!-- Detail modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-cover" id="modal-cover"></div>
    <div class="modal-body">
      <input class="modal-book-title" id="modal-title" type="text" autocomplete="off" />
      <input class="modal-book-author" id="modal-author" type="text" autocomplete="off" />

      <label class="field-label">Status</label>
      <select id="modal-status">
        <option value="reading">Currently Reading</option>
        <option value="plan_to_read">Want to Read</option>
        <option value="read">Read</option>
      </select>

      <label class="field-label">Rating</label>
      <div class="stars-row" id="modal-stars">
        <span class="star" data-v="1">★</span>
        <span class="star" data-v="2">★</span>
        <span class="star" data-v="3">★</span>
        <span class="star" data-v="4">★</span>
        <span class="star" data-v="5">★</span>
      </div>

      <label class="field-label">Date Read</label>
      <div class="date-row">
        <input type="date" id="modal-date-read" />
        <label class="na-label"><input type="checkbox" id="modal-date-na" /> N/A</label>
      </div>

      <!-- ══ Reading Tracker (removable) ══ -->
      <div id="reading-tracker-section">
        <label class="field-label">Current Page</label>
        <div class="tracker-progress-row">
          <input type="number" id="tracker-current-page" min="1" placeholder="—" />
          <span class="tracker-total-label" id="tracker-total-label"></span>
        </div>
        <div class="tracker-bar-wrap" id="tracker-bar-wrap" hidden>
          <div class="tracker-bar-fill" id="tracker-bar-fill"></div>
        </div>
      </div>
      <!-- ══ End Reading Tracker ══ -->

      <!-- ══ Journal (removable) ══ -->
      <div id="reading-journal-section">
        <label class="field-label">Journal</label>
        <div id="journal-entries-list"></div>
        <button class="tracker-entry-btn" id="tracker-entry-btn" type="button">+ Add entry</button>
        <div class="tracker-compose" id="tracker-compose" hidden>
          <textarea id="tracker-entry-text" rows="3" placeholder="Thoughts, quotes, reactions…"></textarea>
          <div class="tracker-compose-actions">
            <button class="btn-save" id="tracker-entry-save" type="button">Save entry</button>
            <button class="btn-ghost" id="tracker-entry-cancel" type="button">Cancel</button>
          </div>
        </div>
      </div>
      <!-- ══ End Journal ══ -->

      <label class="field-label">Notes</label>
      <textarea id="modal-notes" rows="4"></textarea>

      <div class="modal-actions">
        <button class="btn-save" id="modal-save">Save</button>
        <button class="btn-ghost" id="modal-delete">Remove</button>
        <button class="btn-close" id="modal-close-btn">Close</button>
      </div>
    </div>
  </div>
</div>

<div class="book-detail-overlay" id="book-detail-overlay">
  <div class="book-detail-panel">
    <button class="book-detail-close" id="book-detail-close">✕</button>
    <div class="book-detail-layout">
      <div class="book-detail-left">
        <div class="book-detail-cover-slot"></div>
        <div class="book-detail-meta-list"></div>
      </div>
      <div class="book-detail-right">
        <div class="book-detail-badge"></div>
        <div class="book-detail-title"></div>
        <div class="book-detail-author"></div>
        <div class="book-detail-stars"></div>
        <div class="book-detail-progress"></div>
        <div class="book-detail-subjects"></div>
        <div class="book-detail-desc"></div>
        <div class="book-detail-notes"></div>
        <div class="book-detail-actions"></div>
      </div>
    </div>
  </div>
</div>

<div class="status-modal-overlay" id="status-modal-overlay">
  <div class="status-modal">
    <div class="status-modal-title">Add to shelf</div>
    <div class="status-modal-book" id="status-modal-book"></div>
    <div class="status-options">
      <button class="status-opt" data-status="reading">Currently Reading</button>
      <button class="status-opt" data-status="plan_to_read">Want to Read</button>
      <button class="status-opt" data-status="read">Already Read</button>
    </div>
    <button class="status-cancel" id="status-modal-cancel">Cancel</button>
  </div>
</div>

<script src="shared.js?v=14"></script>
<script src="app.js?v=23"></script>
</body>
</html>
